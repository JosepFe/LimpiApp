# The SPA and its API on the same origin: no CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;  # nginx listens on the container's port 80: redirects stay relative to the browser origin

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Behind Traefik (homelab, E08) the connection comes from the Docker network: the browser IP is the one in
    # X-Forwarded-For, skipping the Docker proxies (rate limits on the magic link are per browser).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Completion photos (E04/US-006): up to 8 MB each.
    client_max_body_size 10m;

    # /api/households → http://api:8080/households (without the prefix)
    location /api/ {
        proxy_pass http://api:8080/;
        proxy_set_header Host $http_host;
        proxy_redirect ~^https?://[^/]+/(.*)$ /api/$1;  # the API does not know it lives under /api
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;  # https from Traefik (homelab); empty = not sent (local http)
        proxy_set_header X-Forwarded-Prefix /api;
    }

    # the install manifest and its icons keep their names (E07/US-002): checked again on each visit
    location ~* ^/(manifest\.webmanifest|icons/[a-z0-9-]+\.png)$ {
        types { application/manifest+json webmanifest; image/png png; }
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    # hashed build files: cache forever; a missing one is a 404, not the app
    location ~* \.(js|css|woff2?|ico|png|svg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }

    # app routes (/rooms, /today…) are resolved by Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
    }
}
