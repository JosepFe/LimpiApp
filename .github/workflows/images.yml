# Images of the API and the web in GHCR on every push to master (E08/US-001), only after the gates pass. The homelab
# pulls them with the tag in its deploy/config.env (LIMPIAPP_TAG): deploying a new version = changing that tag there.
# GitHub-hosted runners: this repo is public, and a self-hosted runner would run code from any fork's pull request.
name: images

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: make qa (format, build, unit, integration with Testcontainers, coverage)
        run: make qa

  frontend-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: npm run qa (lint, types, unit, build, e2e, parity against e2e/prototype.html)
        run: npm run qa

  images:
    needs: [backend-qa, frontend-qa]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: backend
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ghcr.io/josepfe/limpiapp-${{ matrix.name }}:sha-${{ github.sha }}
            ghcr.io/josepfe/limpiapp-${{ matrix.name }}:master
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
